services:
  pi:
    build:
      context: .
      args:
        PI_VERSION: ${PI_VERSION:-latest}
    image: rdmo-pi
    init: true
    stdin_open: true
    tty: true
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    volumes:
      - ./pi:/home/pi/.pi
      - ./skills:/home/pi/.agents/skills:ro
      - ./workspace:/workspace
    working_dir: /workspace
